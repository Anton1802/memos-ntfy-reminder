[project]
name = "memos-ntfy-reminder"
version = "0.1.0"
description = "Сервис, который превращает заметки в Memos в напоминания с пуш-уведомлениями через ntfy."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length=120
exclude = [".venv", "venv", ".pytest_cache"]
